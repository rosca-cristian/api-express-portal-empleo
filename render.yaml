services:
  # API Service
  - type: web
    name: api-empleo
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: api-empleo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: api-empleo-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: api-empleo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: api-empleo-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: api-empleo-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: api-empleo-db
    databaseName: portalempleo
    plan: free
    region: oregon
